name: Sync Habitica RPG Card

on:
  schedule:
    - cron: "0 * * * *"  # Otomatis setiap 1 jam
  workflow_dispatch:      # Tombol manual run

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install requests

      - name: Generate RPG Stats Card
        env:
          HABITICA_USER_ID: ${{ secrets.HABITICA_USER_ID }}
          HABITICA_API_TOKEN: ${{ secrets.HABITICA_API_TOKEN }}
        run: python generate_stats.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-stats.svg database.json
          git commit -m "Auto-update RPG stats card [skip ci]" || exit 0
          git push
