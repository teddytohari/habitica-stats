  <text x="26" y="327" class="font-sub">✨ Buffs: <tspan class="font-val">0</tspan> Casts  •  💧 Mana Spent: <tspan class="font-val">0 MP</tspan></text>

  <line x1="16" y1="352" x2="444" y2="352" stroke="#252b40" stroke-width="1"/>

  <!-- ================= PRODUCTIVITY MATRIX ================= -->
  <text x="18" y="374" class="font-sec-prod">📋 PRODUCTIVITY &amp; DISCIPLINE MATRIX</text>

  <!-- Dailies Progress -->
